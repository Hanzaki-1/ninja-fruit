<script>

/* =========================================================
   SETUP
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const game = document.getElementById("game");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const comboEl = document.getElementById("combo");
const messageEl = document.getElementById("message");
const gameOverEl = document.getElementById("gameOver");
const finalScoreEl = document.getElementById("finalScore");

let W=0;
let H=0;

function resize(){

  const dpr=Math.min(window.devicePixelRatio||1,2);

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =========================================================
   GAME STATE
========================================================= */

let mode="classic";

let score=0;
let lives=3;
let combo=0;

let fruits=[];
let pieces=[];
let particles=[];
let blade=[];

let running=false;

let lastTime=0;
let spawnTimer=0;
let gameTime=0;

let difficulty=1;

let pointerDown=false;


/* =========================================================
   FRUIT TYPES
========================================================= */

const fruitTypes=[
  "watermelon",
  "apple",
  "orange",
  "lemon",
  "kiwi",
  "peach",
  "pineapple"
];


/* =========================================================
   START
========================================================= */

function startGame(selectedMode){

  mode=selectedMode;

  menu.style.display="none";
  game.style.display="block";

  gameOverEl.style.display="none";

  score=0;
  lives=3;
  combo=0;

  fruits=[];
  pieces=[];
  particles=[];
  blade=[];

  spawnTimer=0;
  gameTime=0;
  difficulty=1;

  running=true;

  updateHUD();

  lastTime=performance.now();

  requestAnimationFrame(loop);
}


function restartGame(){
  startGame(mode);
}


function backToMenu(){

  running=false;

  game.style.display="none";
  menu.style.display="flex";
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  scoreEl.textContent=score;

  if(mode==="zen"){

    livesEl.textContent="ZEN";

  }else{

    livesEl.textContent=
      "♥ ".repeat(lives)+
      "♡ ".repeat(Math.max(0,3-lives));
  }
}


/* =========================================================
   LIFE
========================================================= */

function loseLife(){

  if(mode==="zen") return;

  lives--;

  combo=0;

  updateHUD();

  showMessage("MISS");

  if(lives<=0){
    endGame();
  }
}


function endGame(){

  running=false;

  finalScoreEl.textContent=score;

  gameOverEl.style.display="flex";
}


/* =========================================================
   SPAWN
========================================================= */

function spawnFruit(){

  const size=
    Math.max(
      34,
      Math.min(54,W*.075)
    );

  const x=
    W*.12+
    Math.random()*W*.76;

  const y=H+size;

  const direction=
    Math.random()<.5?-1:1;

  const vx=
    direction*
    (2+Math.random()*3)*
    difficulty;

  const vy=
    -(10+Math.random()*3.5)*
    Math.min(1.25,difficulty);

  let bomb=false;

  if(
    mode==="classic" &&
    Math.random()<
      Math.min(.16,.07+difficulty*.015)
  ){
    bomb=true;
  }

  const type=
    fruitTypes[
      Math.floor(Math.random()*fruitTypes.length)
    ];

  fruits.push({

    x:x,
    y:y,

    vx:vx,
    vy:vy,

    gravity:.23,

    size:size,

    type:type,

    bomb:bomb,

    rotation:Math.random()*Math.PI*2,

    rotationSpeed:
      (Math.random()-.5)*.12,

    sliced:false
  });
}


function spawnWave(){

  let count=1;

  const r=Math.random();

  if(difficulty>1.3 && r<.4)
    count=2;

  if(difficulty>2 && r<.25)
    count=3;

  if(difficulty>3 && r<.15)
    count=4;

  for(let i=0;i<count;i++){

    setTimeout(()=>{

      if(running){
        spawnFruit();
      }

    },i*65);
  }
}


/* =========================================================
   SLICE
========================================================= */

function sliceFruit(f){

  if(f.sliced) return;

  f.sliced=true;

  if(f.bomb){

    createBombExplosion(f.x,f.y);

    loseLife();

    return;
  }

  score+=10;

  combo++;

  if(combo>=3){

    score+=combo*2;

    showCombo(combo);
  }

  updateHUD();

  createFruitPieces(f);

  createJuice(
    f.x,
    f.y,
    getFruitColor(f.type)
  );
}


/* =========================================================
   FRUIT PIECES
========================================================= */

function createFruitPieces(f){

  const half=f.size*.52;

  pieces.push({

    x:f.x-half*.25,
    y:f.y,

    vx:f.vx-2.2,
    vy:f.vy*.3,

    gravity:.34,

    size:half,

    type:f.type,

    side:"left",

    rotation:f.rotation,

    rotationSpeed:-.12,

    life:1
  });


  pieces.push({

    x:f.x+half*.25,
    y:f.y,

    vx:f.vx+2.2,
    vy:f.vy*.3,

    gravity:.34,

    size:half,

    type:f.type,

    side:"right",

    rotation:f.rotation,

    rotationSpeed:.12,

    life:1
  });
}


/* =========================================================
   JUICE
========================================================= */

function createJuice(x,y,color){

  for(let i=0;i<16;i++){

    const angle=Math.random()*Math.PI*2;
    const speed=1+Math.random()*4;

    particles.push({

      x:x,
      y:y,

      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,

      gravity:.14,

      size:2+Math.random()*4,

      life:1,

      color:color
    });
  }
}


/* =========================================================
   BOMB
========================================================= */

function createBombExplosion(x,y){

  for(let i=0;i<38;i++){

    const angle=Math.random()*Math.PI*2;
    const speed=2+Math.random()*7;

    particles.push({

      x:x,
      y:y,

      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,

      gravity:.18,

      size:2+Math.random()*5,

      life:1,

      bomb:true
    });
  }

  showMessage("BOOM!");
}


/* =========================================================
   COMBO
========================================================= */

function showCombo(value){

  comboEl.textContent="COMBO x"+value;

  comboEl.classList.remove("show");

  void comboEl.offsetWidth;

  comboEl.classList.add("show");

  setTimeout(()=>{
    comboEl.classList.remove("show");
  },600);
}


function showMessage(text){

  messageEl.textContent=text;

  messageEl.style.opacity="1";

  setTimeout(()=>{
    messageEl.style.opacity="0";
  },450);
}


/* =========================================================
   FRUIT COLORS
========================================================= */

function getFruitColor(type){

  if(type==="watermelon") return "#ef3340";
  if(type==="apple") return "#e53935";
  if(type==="orange") return "#ff9800";
  if(type==="lemon") return "#fdd835";
  if(type==="kiwi") return "#7cb342";
  if(type==="peach") return "#ff8a65";
  if(type==="pineapple") return "#fbc02d";

  return "#fff";
}


/* =========================================================
   DRAW FRUIT
========================================================= */

function drawFruit(type,x,y,size,rotation=0){

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(rotation);

  if(type==="watermelon"){
    drawWatermelon(size);
  }

  else if(type==="apple"){
    drawApple(size);
  }

  else if(type==="orange"){
    drawOrange(size);
  }

  else if(type==="lemon"){
    drawLemon(size);
  }

  else if(type==="kiwi"){
    drawKiwi(size);
  }

  else if(type==="peach"){
    drawPeach(size);
  }

  else if(type==="pineapple"){
    drawPineapple(size);
  }

  ctx.restore();
}


/* =========================================================
   WATERMELON
========================================================= */

function drawWatermelon(s){

  ctx.fillStyle="#2e7d32";

  ctx.beginPath();
  ctx.arc(0,0,s*.47,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ef3340";

  ctx.beginPath();
  ctx.arc(0,0,s*.38,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ffe0b2";

  ctx.beginPath();
  ctx.arc(0,0,s*.31,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#111";

  for(let i=0;i<6;i++){

    const a=i*Math.PI/3+.2;

    ctx.beginPath();

    ctx.ellipse(
      Math.cos(a)*s*.2,
      Math.sin(a)*s*.2,
      s*.025,
      s*.06,
      a,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}


/* =========================================================
   APPLE
========================================================= */

function drawApple(s){

  ctx.fillStyle="#d62828";

  ctx.beginPath();

  ctx.arc(-s*.18,0,s*.32,0,Math.PI*2);
  ctx.arc(s*.18,0,s*.32,0,Math.PI*2);

  ctx.fill();

  ctx.fillStyle="#b71c1c";

  ctx.beginPath();

  ctx.arc(0,s*.13,s*.32,0,Math.PI);
  ctx.fill();

  ctx.strokeStyle="#4e342e";
  ctx.lineWidth=s*.07;

  ctx.beginPath();

  ctx.moveTo(0,-s*.25);
  ctx.lineTo(s*.04,-s*.48);

  ctx.stroke();

  ctx.fillStyle="#4caf50";

  ctx.beginPath();

  ctx.ellipse(
    s*.13,
    -s*.43,
    s*.16,
    s*.08,
    -.4,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================================================
   ORANGE
========================================================= */

function drawOrange(s){

  ctx.fillStyle="#f57c00";

  ctx.beginPath();
  ctx.arc(0,0,s*.43,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ffb300";

  ctx.beginPath();
  ctx.arc(0,0,s*.34,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#66bb6a";

  ctx.beginPath();

  ctx.ellipse(
    0,
    -s*.43,
    s*.13,
    s*.06,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================================================
   LEMON
========================================================= */

function drawLemon(s){

  ctx.fillStyle="#fdd835";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    s*.47,
    s*.34,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#fff59d";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    s*.34,
    s*.24,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================================================
   KIWI
========================================================= */

function drawKiwi(s){

  ctx.fillStyle="#795548";

  ctx.beginPath();
  ctx.arc(0,0,s*.44,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#8bc34a";

  ctx.beginPath();
  ctx.arc(0,0,s*.34,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#f1f8e9";

  ctx.beginPath();
  ctx.arc(0,0,s*.09,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#222";

  for(let i=0;i<14;i++){

    const a=i*Math.PI*2/14;

    ctx.beginPath();

    ctx.arc(
      Math.cos(a)*s*.24,
      Math.sin(a)*s*.24,
      s*.018,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}


/* =========================================================
   PEACH
========================================================= */

function drawPeach(s){

  ctx.fillStyle="#ff8a65";

  ctx.beginPath();

  ctx.arc(-s*.16,0,s*.32,0,Math.PI*2);
  ctx.arc(s*.16,0,s*.32,0,Math.PI*2);

  ctx.fill();

  ctx.fillStyle="#ffab91";

  ctx.beginPath();

  ctx.arc(0,0,s*.29,0,Math.PI*2);

  ctx.fill();

  ctx.strokeStyle="#e57373";
  ctx.lineWidth=s*.035;

  ctx.beginPath();

  ctx.moveTo(0,-s*.25);
  ctx.quadraticCurveTo(
    -s*.12,
    0,
    0,
    s*.25
  );

  ctx.stroke();
}


/* =========================================================
   PINEAPPLE
========================================================= */

function drawPineapple(s){

  ctx.fillStyle="#fbc02d";

  ctx.beginPath();

  ctx.ellipse(
    0,
    s*.05,
    s*.35,
    s*.45,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle="#8d6e63";
  ctx.lineWidth=s*.025;

  for(let i=-2;i<=2;i++){

    ctx.beginPath();

    ctx.moveTo(
      -s*.3,
      i*s*.15
    );

    ctx.lineTo(
      s*.3,
      i*s*.15
    );

    ctx.stroke();
  }

  ctx.fillStyle="#388e3c";

  for(let i=0;i<4;i++){

    ctx.save();

    ctx.rotate(
      (i-1.5)*.3
    );

    ctx.beginPath();

    ctx.ellipse(
      0,
      -s*.48,
      s*.08,
      s*.28,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }
}


/* =========================================================
   DRAW BOMB
========================================================= */

function drawBomb(s){

  ctx.fillStyle="#101010";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    s*.42,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle="#777";
  ctx.lineWidth=2;

  ctx.stroke();

  ctx.strokeStyle="#a06b22";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(s*.18,-s*.32);

  ctx.quadraticCurveTo(
    s*.45,
    -s*.65,
    s*.3,
    -s*.8
  );

  ctx.stroke();

  ctx.fillStyle="#ff9800";

  ctx.beginPath();

  ctx.arc(
    s*.3,
    -s*.8,
    s*.08,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================================================
   DRAW HALF
========================================================= */

function drawHalfFruit(p){

  ctx.save();

  ctx.translate(p.x,p.y);
  ctx.rotate(p.rotation);

  ctx.globalAlpha=Math.max(0,p.life);

  /*
    Clip the fruit into two clean halves.
  */

  ctx.save();

  ctx.beginPath();

  if(p.side==="left"){

    ctx.rect(
      -p.size,
      -p.size,
      p.size,
      p.size*2
    );

  }else{

    ctx.rect(
      0,
      -p.size,
      p.size,
      p.size*2
    );
  }

  ctx.clip();

  drawFruit(
    p.type,
    0,
    0,
    p.size*1.85,
    0
  );

  ctx.restore();

  /*
    Visible cut surface.
  */

  ctx.fillStyle="#fff3e0";

  ctx.beginPath();

  if(p.side==="left"){

    ctx.ellipse(
      0,
      0,
      p.size*.07,
      p.size*.55,
      0,
      0,
      Math.PI*2
    );

  }else{

    ctx.ellipse(
      0,
      0,
      p.size*.07,
      p.size*.55,
      0,
      0,
      Math.PI*2
    );
  }

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   COLLISION
========================================================= */

function distanceToSegment(px,py,x1,y1,x2,y2){

  const dx=x2-x1;
  const dy=y2-y1;

  if(dx===0 && dy===0){

    return Math.hypot(
      px-x1,
      py-y1
    );
  }

  let t=
    (
      (px-x1)*dx+
      (py-y1)*dy
    )/
    (dx*dx+dy*dy);

  t=Math.max(0,Math.min(1,t));

  const x=x1+t*dx;
  const y=y1+t*dy;

  return Math.hypot(
    px-x,
    py-y
  );
}


function checkSlice(x1,y1,x2,y2){

  for(const f of fruits){

    if(f.sliced) continue;

    const distance=
      distanceToSegment(
        f.x,
        f.y,
        x1,
        y1,
        x2,
        y2
      );

    if(distance<f.size*.7){

      sliceFruit(f);
    }
  }
}


/* =========================================================
   TOUCH
========================================================= */

canvas.addEventListener(
  "pointerdown",
  e=>{

    pointerDown=true;

    blade=[
      {
        x:e.clientX,
        y:e.clientY,
        life:1
      }
    ];
  }
);


canvas.addEventListener(
  "pointermove",
  e=>{

    if(!pointerDown) return;

    const previous=
      blade[blade.length-1];

    const current={
      x:e.clientX,
      y:e.clientY,
      life:1
    };

    blade.push(current);

    if(blade.length>14){
      blade.shift();
    }

    checkSlice(
      previous.x,
      previous.y,
      current.x,
      current.y
    );
  }
);


canvas.addEventListener(
  "pointerup",
  ()=>{
    pointerDown=false;
  }
);


canvas.addEventListener(
  "pointercancel",
  ()=>{
    pointerDown=false;
  }
);


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  gameTime+=dt;

  difficulty=
    1+
    Math.min(
      3.2,
      gameTime/180
    );

  spawnTimer+=dt;

  const spawnDelay=
    Math.max(
      430,
      900-difficulty*120
    );

  if(spawnTimer>spawnDelay){

    spawnTimer=0;

    spawnWave();
  }


  /* FRUITS */

  for(let i=fruits.length-1;i>=0;i--){

    const f=fruits[i];

    if(f.sliced){

      fruits.splice(i,1);

      continue;
    }

    f.x+=f.vx;
    f.y+=f.vy;

    f.vy+=f.gravity;

    f.rotation+=f.rotationSpeed;

    /*
      Missed fruit
    */

    if(f.y-f.size>H){

      fruits.splice(i,1);

      if(mode==="classic"){
        loseLife();
      }

      combo=0;
    }
  }


  /* PIECES */

  for(let i=pieces.length-1;i>=0;i--){

    const p=pieces[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.vy+=p.gravity;

    p.rotation+=p.rotationSpeed;

    p.life-=.018;

    if(
      p.life<=0 ||
      p.y-p.size>H+100
    ){
      pieces.splice(i,1);
    }
  }


  /* PARTICLES */

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.vy+=p.gravity;

    p.life-=.025;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }


  /* BLADE */

  for(let i=blade.length-1;i>=0;i--){

    blade[i].life-=.09;

    if(blade[i].life<=0){
      blade.splice(i,1);
    }
  }
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(0,0,W,H);

  const bg=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  bg.addColorStop(0,"#171717");
  bg.addColorStop(1,"#020202");

  ctx.fillStyle=bg;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* FRUITS */

  for(const f of fruits){

    if(f.sliced) continue;

    ctx.save();

    if(f.bomb){

      ctx.translate(
        f.x,
        f.y
      );

      ctx.rotate(f.rotation);

      drawBomb(f.size);

    }else{

      drawFruit(
        f.type,
        f.x,
        f.y,
        f.size,
        f.rotation
      );
    }

    ctx.restore();
  }


  /* PIECES */

  for(const p of pieces){

    drawHalfFruit(p);
  }


  /* PARTICLES */

  for(const p of particles){

    ctx.save();

    ctx.globalAlpha=
      Math.max(0,p.life);

    ctx.fillStyle=
      p.bomb
      ? (Math.random()>.5?"#ff9800":"#fff")
      : p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }


  /* BLADE */

  if(blade.length>1){

    for(let i=1;i<blade.length;i++){

      const a=blade[i-1];
      const b=blade[i];

      ctx.save();

      ctx.globalAlpha=
        Math.min(
          a.life,
          b.life
        );

      ctx.strokeStyle="#fff";

      ctx.lineWidth=5;

      ctx.lineCap="round";

      ctx.shadowBlur=12;
      ctx.shadowColor="#fff";

      ctx.beginPath();

      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);

      ctx.stroke();

      ctx.restore();
    }
  }
}


/* =========================================================
   LOOP
========================================================= */

function loop(time){

  if(!running) return;

  const dt=
    Math.min(
      2,
      (time-lastTime)/16.67
    );

  lastTime=time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

</script>

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Ninja Fruit</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!-- =========================
         MODE SELECTION
    ========================== -->

    <section id="modeScreen">

        <div class="mode-container">

            <div class="ninja">🥷</div>

            <div class="small-title">
                NINJA FRUIT
            </div>

            <h1>
                CHOOSE
                <span>YOUR MODE</span>
            </h1>

            <p class="instruction">
                SLICE THROUGH A MODE TO SELECT
            </p>


            <!-- MODE RINGS -->

            <div class="mode-rings">

                <!-- CLASSIC -->

                <button
                    id="classicBtn"
                    class="mode-ring classic-ring"
                    type="button">

                    <div class="inner-ring">

                        <div class="mode-icon">
                            💣
                        </div>

                        <strong>
                            CLASSIC
                        </strong>

                        <small>
                            BOMBS
                        </small>

                    </div>

                </button>


                <!-- ZEN -->

                <button
                    id="zenBtn"
                    class="mode-ring zen-ring"
                    type="button">

                    <div class="inner-ring">

                        <div class="mode-icon">
                            🌿
                        </div>

                        <strong>
                            ZEN
                        </strong>

                        <small>
                            NO BOMBS
                        </small>

                    </div>

                </button>

            </div>


            <div class="slice-hint">
                <span>↙</span>
                SWIPE
                <span>↘</span>
            </div>

        </div>

    </section>


    <!-- =========================
         GAME
    ========================== -->

    <section id="gameScreen" class="hidden">

        <canvas id="canvas"></canvas>

        <div class="hud">

            <div class="hud-box">
                <small>SCORE</small>
                <strong id="score">0</strong>
            </div>

            <div class="hud-box">
                <small>COMBO</small>
                <strong id="combo">0</strong>
            </div>

            <div class="hud-box">
                <small>LIVES</small>
                <strong id="lives">❤️❤️❤️</strong>
            </div>

        </div>

        <button id="musicButton">
            🔊
        </button>

    </section>


    <!-- =========================
         GAME OVER
    ========================== -->

    <section id="gameOver" class="hidden">

        <div class="game-over-box">

            <div class="game-over-icon">
                💥
            </div>

            <div class="small-title">
                NICE TRY, NINJA
            </div>

            <h2>
                GAME OVER
            </h2>

            <p>
                FINAL SCORE
            </p>

            <strong id="finalScore">
                0
            </strong>

            <button id="restartBtn">
                PLAY AGAIN
            </button>

            <button id="menuBtn">
                MODE SELECT
            </button>

        </div>

    </section>


    <!-- MUSIC -->

    <audio id="zenMusic" loop preload="auto">
        <source src="zen.mp3" type="audio/mpeg">
    </audio>


    <script src="script.js"></script>

</div>

</body>
</html>
```

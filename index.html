<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Ninja Fruit Mobile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <div id="menu">
        <h1>🥷 Ninja Fruit</h1>
        <p>Swipe the fruits!</p>
        <button id="startBtn">START GAME</button>
    </div>

    <div id="top">
        <span>Score: <b id="score">0</b></span>
        <span>❤️ <b id="lives">3</b></span>
    </div>

    <canvas id="canvas"></canvas>

    <div id="gameOver">
        <h1>GAME OVER</h1>
        <p>Score: <b id="finalScore">0</b></p>
        <button onclick="restartGame()">TRY AGAIN</button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>

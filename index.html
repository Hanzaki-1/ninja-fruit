<body>

<!-- ================= MENU ================= -->

<div id="menu">

<div id="game">

  <div id="message"></div>

  <div id="hint">SWIPE TO SLICE</div>

      SCORE: <span id="finalScore">0</span>
    </div>

      <button class="game-btn" onclick="restartGame()">REPLAY</button>
      <button class="game-btn" onclick="backToMenu()">MENU</button>
    </div>

<script>
/* =========================================================
   NINJA FRUIT
   Fruit Ninja-style mechanics
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const game = document.getElementById("game");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const comboEl = document.getElementById("combo");
const messageEl = document.getElementById("message");
const gameOverEl = document.getElementById("gameOver");
const finalScoreEl = document.getElementById("finalScore");

let W = 0;
let H = 0;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

window.addEventListener("resize",resize);
resize();

/* ================= GAME STATE ================= */

let mode = "classic";
let score = 0;
let lives = 3;
let combo = 0;

let fruits = [];
let pieces = [];
let particles = [];

let blade = [];

let running = false;
let gameTime = 0;
let lastTime = 0;
let spawnTimer = 0;

let difficulty = 1;

let pointerDown = false;

/* ================= FRUIT TYPES ================= */

const fruitTypes = [
  {
    emoji:"🍉",
    color:"#e53935"
  },
  {
    emoji:"🍎",
    color:"#e53935"
  },
  {
    emoji:"🍊",
    color:"#ff9800"
  },
  {
    emoji:"🍋",
    color:"#fdd835"
  },
  {
    emoji:"🍍",
    color:"#fbc02d"
  },
  {
    emoji:"🥝",
    color:"#7cb342"
  },
  {
    emoji:"🥥",
    color:"#795548"
  },
  {
    emoji:"🍑",
    color:"#ff8a65"
  }
];

/* ================= START ================= */

function startGame(selectedMode){

  mode = selectedMode;

  menu.style.display = "none";
  game.style.display = "block";
  gameOverEl.style.display = "none";

  score = 0;
  lives = 3;
  combo = 0;

  fruits = [];
  pieces = [];
  particles = [];
  blade = [];

  gameTime = 0;
  spawnTimer = 0;
  difficulty = 1;

  running = true;

  updateHUD();

  lastTime = performance.now();

  requestAnimationFrame(loop);
}

/* ================= RESTART ================= */

function restartGame(){
  startGame(mode);
}

function backToMenu(){

  running = false;

  game.style.display = "none";
  menu.style.display = "flex";
}

/* ================= HUD ================= */

function updateHUD(){

  scoreEl.textContent = score;

  if(mode === "zen"){
    livesEl.textContent = "ZEN";
  }else{
    livesEl.textContent =
      "♥ ".repeat(lives) +
      "♡ ".repeat(Math.max(0,3-lives));
  }
}

/* ================= LOSE LIFE ================= */

function loseLife(){

  if(mode === "zen") return;

  lives--;

  combo = 0;

  updateHUD();

  showMessage("MISS");

  if(lives <= 0){
    endGame();
  }
}

/* ================= END GAME ================= */

function endGame(){

  running = false;

  finalScoreEl.textContent = score;

  gameOverEl.style.display = "flex";
}

/* =========================================================
   FRUIT SPAWNING
   ========================================================= */

function spawnFruit(){

  const type =
    fruitTypes[
      Math.floor(Math.random()*fruitTypes.length)
    ];

  const size =
    Math.max(34,Math.min(55,W * .075));

  /*
    Fruit Ninja style:
    launch from bottom with horizontal velocity
    and strong upward velocity.
  */

  const x =
    W * .15 +
    Math.random() * W * .7;

  const y = H + size;

  const direction =
    Math.random() < .5 ? -1 : 1;

  const vx =
    direction *
    (2.2 + Math.random()*2.4) *
    difficulty;

  const vy =
    -(10 + Math.random()*3.5) *
    Math.min(1.2,difficulty);

  let bomb = false;

  /*
    Bombs only appear in Classic.
    Keep them less frequent than fruit.
  */

  if(
    mode === "classic" &&
    Math.random() < Math.min(.16,.08 + difficulty*.015)
  ){
    bomb = true;
  }

  fruits.push({

    x,
    y,

    vx,
    vy,

    gravity:0.23,

    size,

    type,

    bomb,

    rotation:Math.random()*Math.PI*2,

    rotationSpeed:
      (Math.random()-.5)*.12,

    sliced:false,

    missed:false

  });
}

/* ================= SPAWN WAVES ================= */

function spawnWave(){

  /*
    Early game:
    mostly single fruit.

    Later:
    groups of 2-4.
  */

  let count = 1;

  const r = Math.random();

  if(difficulty > 1.4 && r < .35)
    count = 2;

  if(difficulty > 2 && r < .25)
    count = 3;

  if(difficulty > 3 && r < .15)
    count = 4;

  for(let i=0;i<count;i++){

    setTimeout(()=>{
      if(running) spawnFruit();
    },i*65);

  }
}

/* =========================================================
   SLICE FRUIT
   ========================================================= */

function sliceFruit(fruit){

  if(fruit.sliced) return;

  fruit.sliced = true;

  /*
    Remove it visually immediately.
    This prevents the original whole fruit
    from appearing underneath the two halves.
  */

  if(fruit.bomb){

    createBombExplosion(fruit.x,fruit.y);

    loseLife();

    return;
  }

  score += 10;

  combo++;

  /*
    Combo bonus
  */

  if(combo >= 3){

    score += combo * 2;

    showCombo(combo);
  }

  updateHUD();

  createFruitPieces(fruit);

  createJuice(fruit.x,fruit.y,fruit.type.color);

}

/* =========================================================
   TWO CLEAN FRUIT HALVES
   ========================================================= */

function createFruitPieces(fruit){

  const half = fruit.size * .52;

  pieces.push({

    x:fruit.x - half*.28,
    y:fruit.y,

    vx:fruit.vx - 2.2,
    vy:fruit.vy * .35,

    gravity:.34,

    size:half,

    emoji:fruit.type.emoji,

    side:"left",

    rotation:fruit.rotation,

    rotationSpeed:-.12,

    life:1

  });

  pieces.push({

    x:fruit.x + half*.28,
    y:fruit.y,

    vx:fruit.vx + 2.2,
    vy:fruit.vy * .35,

    gravity:.34,

    size:half,

    emoji:fruit.type.emoji,

    side:"right",

    rotation:fruit.rotation,

    rotationSpeed:.12,

    life:1

  });
}

/* =========================================================
   JUICE
   ========================================================= */

function createJuice(x,y,color){

  for(let i=0;i<12;i++){

    const angle =
      Math.random()*Math.PI*2;

    const speed =
      1 + Math.random()*4;

    particles.push({

      x,
      y,

      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,

      gravity:.13,

      size:2+Math.random()*4,

      life:1,

      color

    });
  }
}

/* =========================================================
   BOMB EXPLOSION
   ========================================================= */

function createBombExplosion(x,y){

  for(let i=0;i<35;i++){

    const angle =
      Math.random()*Math.PI*2;

    const speed =
      2 + Math.random()*7;

    particles.push({

      x,
      y,

      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,

      gravity:.18,

      size:2+Math.random()*5,

      life:1,

      bomb:true

    });
  }

  showMessage("BOOM!");
}

/* =========================================================
   COMBO
   ========================================================= */

function showCombo(value){

  comboEl.textContent = "COMBO x" + value;

  comboEl.classList.remove("show");

  /*
    Force animation restart.
  */

  void comboEl.offsetWidth;

  comboEl.classList.add("show");

  setTimeout(()=>{
    comboEl.classList.remove("show");
  },550);
}

/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text){

  messageEl.textContent = text;
  messageEl.style.opacity = "1";

  setTimeout(()=>{
    messageEl.style.opacity = "0";
  },450);
}

/* =========================================================
   UPDATE
   ========================================================= */

function update(dt){

  gameTime += dt;

  /*
    Difficulty slowly increases.
  */

  difficulty =
    1 +
    Math.min(3.2,gameTime / 180);

  /*
    Spawn timing.
  */

  spawnTimer += dt;

  const spawnDelay =
    Math.max(
      430,
      900 - difficulty*120
    );

  if(spawnTimer > spawnDelay){

    spawnTimer = 0;

    spawnWave();
  }

  /* ================= FRUITS ================= */

  for(let i=fruits.length-1;i>=0;i--){

    const f = fruits[i];

    if(f.sliced){

      /*
        Already converted into halves.
        Remove original fruit.
      */

      fruits.splice(i,1);

      continue;
    }

    f.x += f.vx;
    f.y += f.vy;

    f.vy += f.gravity;

    f.rotation += f.rotationSpeed;

    /*
      Fruit reaches the bottom.

      Classic:
      missed fruit = lose life.

      Zen:
      simply remove it.
    */

    if(f.y - f.size > H){

      fruits.splice(i,1);

      if(!f.sliced){

        if(mode === "classic"){
          loseLife();
        }

        combo = 0;
      }
    }
  }

  /* ================= SPLIT PIECES ================= */

  for(let i=pieces.length-1;i>=0;i--){

    const p = pieces[i];

    p.x += p.vx;
    p.y += p.vy;

    p.vy += p.gravity;

    p.rotation += p.rotationSpeed;

    p.life -= .018;

    if(
      p.life <= 0 ||
      p.y - p.size > H + 100
    ){
      pieces.splice(i,1);
    }
  }

  /* ================= PARTICLES ================= */

  for(let i=particles.length-1;i>=0;i--){

    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.vy += p.gravity;

    p.life -= .025;

    if(p.life <= 0){
      particles.splice(i,1);
    }
  }

  /* ================= BLADE ================= */

  for(let i=blade.length-1;i>=0;i--){

    blade[i].life -= .09;

    if(blade[i].life <= 0){
      blade.splice(i,1);
    }
  }
}

/* =========================================================
   DRAW
   ========================================================= */

function draw(){

  ctx.clearRect(0,0,W,H);

  /*
    Subtle background atmosphere.
  */

  const gradient =
    ctx.createLinearGradient(0,0,0,H);

  gradient.addColorStop(0,"#151515");
  gradient.addColorStop(1,"#030303");

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,W,H);

  /* ================= FRUITS ================= */

  for(const f of fruits){

    if(f.sliced) continue;

    ctx.save();

    ctx.translate(f.x,f.y);
    ctx.rotate(f.rotation);

    if(f.bomb){

      drawBomb(f.size);

    }else{

      ctx.font =
        `${f.size}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(
        f.type.emoji,
        0,
        0
      );
    }

    ctx.restore();
  }

  /* ================= SPLIT FRUIT ================= */

  for(const p of pieces){

    drawHalfFruit(p);
  }

  /* ================= PARTICLES ================= */

  for(const p of particles){

    ctx.save();

    ctx.globalAlpha =
      Math.max(0,p.life);

    ctx.translate(p.x,p.y);

    if(p.bomb){

      ctx.fillStyle =
        Math.random() > .5
        ? "#ff9800"
        : "#fff";

    }else{

      ctx.fillStyle =
        p.color || "#fff";
    }

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }

  /* ================= BLADE ================= */

  if(blade.length > 1){

    for(let i=1;i<blade.length;i++){

      const a = blade[i-1];
      const b = blade[i];

      ctx.save();

      ctx.globalAlpha =
        Math.min(a.life,b.life);

      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";

      ctx.shadowBlur = 12;
      ctx.shadowColor = "#fff";

      ctx.beginPath();

      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);

      ctx.stroke();

      ctx.restore();
    }
  }
}

/* =========================================================
   BOMB DRAW
   ========================================================= */

function drawBomb(size){

  /*
    Black bomb with fuse.
  */

  ctx.fillStyle = "#111";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    size*.42,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle = "#777";
  ctx.lineWidth = 2;

  ctx.stroke();

  /*
    Fuse
  */

  ctx.strokeStyle = "#b8860b";
  ctx.lineWidth = 4;

  ctx.beginPath();

  ctx.moveTo(size*.18,-size*.32);

  ctx.quadraticCurveTo(
    size*.45,
    -size*.65,
    size*.3,
    -size*.8
  );

  ctx.stroke();

  /*
    Spark
  */

  ctx.fillStyle = "#ff9800";

  ctx.beginPath();

  ctx.arc(
    size*.3,
    -size*.8,
    size*.09,
    0,
    Math.PI*2
  );

  ctx.fill();
}

/* =========================================================
   DRAW HALF FRUIT
   ========================================================= */

function drawHalfFruit(p){

  ctx.save();

  ctx.translate(p.x,p.y);
  ctx.rotate(p.rotation);

  ctx.globalAlpha =
    Math.max(0,p.life);

  /*
    Clip one half of the emoji.
    This makes ONE fruit become TWO pieces.
  */

  ctx.beginPath();

  if(p.side === "left"){

    ctx.rect(
      -p.size,
      -p.size,
      p.size,
      p.size*2
    );

  }else{

    ctx.rect(
      0,
      -p.size,
      p.size,
      p.size*2
    );
  }

  ctx.clip();

  ctx.font =
    `${p.size*1.95}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    p.emoji,
    0,
    0
  );

  ctx.restore();

  /*
    Small bright cut line.
  */

  ctx.save();

  ctx.translate(p.x,p.y);
  ctx.rotate(p.rotation);

  ctx.strokeStyle =
    "rgba(255,255,255,.75)";

  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(0,-p.size*.55);
  ctx.lineTo(0,p.size*.55);

  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   SLICE COLLISION
   ========================================================= */

function distanceToSegment(
  px,py,
  x1,y1,
  x2,y2
){

  const dx = x2-x1;
  const dy = y2-y1;

  if(dx === 0 && dy === 0){

    return Math.hypot(
      px-x1,
      py-y1
    );
  }

  let t =
    (
      (px-x1)*dx +
      (py-y1)*dy
    ) /
    (dx*dx+dy*dy);

  t = Math.max(0,Math.min(1,t));

  const x =
    x1+t*dx;

  const y =
    y1+t*dy;

  return Math.hypot(
    px-x,
    py-y
  );
}

function checkSlice(x1,y1,x2,y2){

  for(const f of fruits){

    if(f.sliced) continue;

    const distance =
      distanceToSegment(
        f.x,
        f.y,
        x1,
        y1,
        x2,
        y2
      );

    /*
      Collision radius.
    */

    if(distance < f.size*.65){

      sliceFruit(f);
    }
  }
}

/* =========================================================
   POINTER / TOUCH
   ========================================================= */

canvas.addEventListener(
  "pointerdown",
  e => {

    pointerDown = true;

    blade = [
      {
        x:e.clientX,
        y:e.clientY,
        life:1
      }
    ];
  }
);

canvas.addEventListener(
  "pointermove",
  e => {

    if(!pointerDown) return;

    const previous =
      blade[blade.length-1];

    const current = {
      x:e.clientX,
      y:e.clientY,
      life:1
    };

    blade.push(current);

    if(blade.length > 12){
      blade.shift();
    }

    checkSlice(
      previous.x,
      previous.y,
      current.x,
      current.y
    );
  }
);

canvas.addEventListener(
  "pointerup",
  () => {

    pointerDown = false;
  }
);

canvas.addEventListener(
  "pointercancel",
  () => {

    pointerDown = false;
  }
);

canvas.addEventListener(
  "pointerleave",
  () => {

    pointerDown = false;
  }
);

/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(time){

  if(!running) return;

  const dt =
    Math.min(
      2,
      (time-lastTime)/16.67
    );

  lastTime = time;

  update(dt);

  draw();

  requestAnimationFrame(loop);
}

</script>

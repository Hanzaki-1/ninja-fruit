}

#flash{
    position:absolute;
    inset:0;
    background:#ff0000;

}

#frenzy{

    top:145px;

    transform:translateX(-50%);
    color:#ffe600;
    font-size:25px;
    font-weight:1000;
    opacity:0;

}

.frenzyOn{
    animation:frenzyAnim .8s ease-out;
}

@keyframes frenzyAnim{
    0%{opacity:0;transform:translateX(-50%) scale(.5)}
    30%{opacity:1;transform:translateX(-50%) scale(1.2)}
    100%{opacity:0;transform:translateX(-50%) scale(1)}
}
</style>
</head>

<body>

<div id="game">

    <div id="hud">
        <div class="hudBox">SCORE <span id="score">0</span></div>
        <div class="hudBox" id="lives">❤️❤️❤️</div>
    </div>

    <div id="combo">COMBO x3</div>
    <div id="frenzy">⚡ FRENZY!</div>
    <div id="flash"></div>

    <div id="menu">
        <div class="panel">

            <h1 class="title">NINJA FRUIT 2</h1>

            <div class="subtitle">
                Slice. Combo. Survive.
            </div>

            <div id="finalScore">
                Ready?
            </div>

            <button id="startBtn">START GAME</button>

            <div class="instructions">
                Swipe across the screen to slice fruit.<br>
                🍉 Fruit = points<br>
                💣 Bomb = lose a life<br>
                ❤️ You have 3 lives
            </div>

        </div>
    </div>

</div>

<script>
const game = document.getElementById("game");
const menu = document.getElementById("menu");
const startBtn = document.getElementById("startBtn");
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const finalScore = document.getElementById("finalScore");
const comboEl = document.getElementById("combo");
const frenzyEl = document.getElementById("frenzy");
const flash = document.getElementById("flash");

let score = 0;
let lives = 3;
let playing = false;

let fruits = [];
let slashPoints = [];

let spawnTimer = null;
let gameLoop = null;

let combo = 0;
let comboTimer = null;

let difficulty = 1;
let frenzy = false;
let frenzyTimer = null;

const fruitTypes = [
    "apple",
    "orange",
    "watermelon",
    "banana",
    "strawberry",
    "pineapple",
    "kiwi"
];

function random(min,max){
    return Math.random()*(max-min)+min;
}

function updateHUD(){
    scoreEl.textContent = score;

    let hearts = "";

    for(let i=0;i<lives;i++){
        hearts += "❤️";
    }

    for(let i=lives;i<3;i++){
        hearts += "🖤";
    }

    livesEl.textContent = hearts;
}

function startGame(){

    clearGame();

    score = 0;
    lives = 3;
    combo = 0;
    difficulty = 1;
    frenzy = false;

    playing = true;

    updateHUD();

    menu.style.display = "none";

    spawnTimer = setInterval(
        spawnWave,
        850
    );

    gameLoop = requestAnimationFrame(update);

    setTimeout(spawnWave,300);
    setTimeout(spawnWave,650);
}

function clearGame(){

    fruits.forEach(f=>{
        if(f.el) f.el.remove();
    });

    fruits = [];

    if(spawnTimer){
        clearInterval(spawnTimer);
        spawnTimer = null;
    }

    if(gameLoop){
        cancelAnimationFrame(gameLoop);
        gameLoop = null;
    }

    document
        .querySelectorAll(".particle,.point,.slash")
        .forEach(e=>e.remove());
}

function spawnWave(){

    if(!playing) return;

    difficulty = 1 + score / 350;

    const count =
        Math.random() <
        Math.min(.45,difficulty*.06)
        ? 2
        : 1;

    for(let i=0;i<count;i++){
        spawnFruit();
    }

    /* occasional bomb */
    if(Math.random() < .14 + difficulty*.01){
        setTimeout(()=>{
            if(playing) spawnBomb();
        },random(100,350));
    }
}

function spawnFruit(){

    const el = document.createElement("div");

    const type =
        fruitTypes[
            Math.floor(Math.random()*fruitTypes.length)
        ];

    el.className = "fruit " + type;

    const width = game.clientWidth;
    const height = game.clientHeight;

    const x = random(30,width-105);

    /*
       Start below the bottom and throw upward.
    */
    const y = height + 90;

    el.style.left = x + "px";
    el.style.top = y + "px";

    game.appendChild(el);

    const fruit = {
        el,
        x,
        y,
        vx:random(-2.8,2.8),
        vy:random(-15.5,-12.5) * Math.min(difficulty,1.8),
        gravity:.42 + difficulty*.025,
        rotation:random(-20,20),
        rotationSpeed:random(-7,7),
        type,
        sliced:false,
        dead:false
    };

    fruits.push(fruit);
}

function spawnBomb(){

    const el = document.createElement("div");

    el.className = "fruit bomb";

    const width = game.clientWidth;
    const height = game.clientHeight;

    const x = random(30,width-105);
    const y = height + 90;

    el.style.left = x + "px";
    el.style.top = y + "px";

    game.appendChild(el);

    fruits.push({
        el,
        x,
        y,
        vx:random(-2.5,2.5),
        vy:random(-15,-12),
        gravity:.44,
        rotation:0,
        rotationSpeed:random(-8,8),
        type:"bomb",
        sliced:false,
        dead:false
    });
}

function update(){

    if(!playing) return;

    const width = game.clientWidth;
    const height = game.clientHeight;

    for(let i=fruits.length-1;i>=0;i--){

        const f = fruits[i];

        if(f.dead){
            fruits.splice(i,1);
            continue;
        }

        f.vy += f.gravity;

        f.x += f.vx;
        f.y += f.vy;

        f.rotation += f.rotationSpeed;

        /* wall bounce */
        if(f.x < 5){
            f.x = 5;
            f.vx *= -1;
        }

        if(f.x > width-90){
            f.x = width-90;
            f.vx *= -1;
        }

        f.el.style.left = f.x + "px";
        f.el.style.top = f.y + "px";

        f.el.style.transform =
            `rotate(${f.rotation}deg)`;

        /*
          IMPORTANT:
          Falling fruit does NOT reduce health.
          It is simply removed when it leaves the screen.
        */
        if(f.y > height + 120){

            f.el.remove();
            fruits.splice(i,1);
        }
    }

    gameLoop = requestAnimationFrame(update);
}

/* =========================
   SLICE DETECTION
========================= */

function getTouchPosition(e){

    const rect = game.getBoundingClientRect();

    let clientX;
    let clientY;

    if(e.touches && e.touches.length){
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    }else{
        clientX = e.clientX;
        clientY = e.clientY;
    }

    return {
        x:clientX-rect.left,
        y:clientY-rect.top
    };
}

function startSwipe(e){

    if(!playing) return;

    const p = getTouchPosition(e);

    slashPoints = [p];

    createSlashPoint(p);
}

function moveSwipe(e){

    if(!playing || slashPoints.length===0) return;

    e.preventDefault();

    const p = getTouchPosition(e);

    const previous =
        slashPoints[slashPoints.length-1];

    slashPoints.push(p);

    if(slashPoints.length>8){
        slashPoints.shift();
    }

    drawSlash(previous,p);

    checkSlice(previous,p);

    createSlashPoint(p);
}

function endSwipe(){

    slashPoints = [];
}

function createSlashPoint(p){

    const dot = document.createElement("div");

    dot.className = "slash";

    dot.style.width = "1px";
    dot.style.height = "1px";

    dot.style.left = p.x+"px";
    dot.style.top = p.y+"px";

    game.appendChild(dot);

    setTimeout(()=>{
        dot.remove();
    },100);
}

function drawSlash(a,b){

    const dx = b.x-a.x;
    const dy = b.y-a.y;

    const length =
        Math.sqrt(dx*dx+dy*dy);

    if(length<4) return;

    const line = document.createElement("div");

    line.className = "slash";

    line.style.width = length+"px";
    line.style.left = a.x+"px";
    line.style.top = a.y+"px";

    line.style.transform =
        `rotate(${Math.atan2(dy,dx)}rad)`;

    game.appendChild(line);

    setTimeout(()=>{
        line.remove();
    },100);
}

function checkSlice(a,b){

    for(let i=fruits.length-1;i>=0;i--){

        const f = fruits[i];

        if(f.dead || f.sliced) continue;

        const cx = f.x + 38;
        const cy = f.y + 38;

        if(distancePointToLine(
            cx,cy,
            a.x,a.y,
            b.x,b.y
        ) < 42){

            f.sliced = true;

            if(f.type === "bomb"){

                hitBomb(f);

            }else{

                sliceFruit(f);
            }
        }
    }
}

function distancePointToLine(px,py,x1,y1,x2,y2){

    const A = px-x1;
    const B = py-y1;
    const C = x2-x1;
    const D = y2-y1;

    const dot = A*C+B*D;

    const lenSq = C*C+D*D;

    let param = -1;

    if(lenSq !== 0){
        param = dot/lenSq;
    }

    let xx,yy;

    if(param<0){
        xx=x1;
        yy=y1;
    }else if(param>1){
        xx=x2;
        yy=y2;
    }else{
        xx=x1+param*C;
        yy=y1+param*D;
    }

    const dx=px-xx;
    const dy=py-yy;

    return Math.sqrt(dx*dx+dy*dy);
}

/* =========================
   FRUIT CUT
========================= */

function sliceFruit(f){

    f.dead = true;

    const basePoints = 10;

    combo++;

    let multiplier = 1;

    if(combo>=10){
        multiplier=4;
    }else if(combo>=5){
        multiplier=3;
    }else if(combo>=3){
        multiplier=2;
    }

    const points =
        basePoints * multiplier;

    score += points;

    updateHUD();

    showPoints(
        f.x+20,
        f.y+20,
        "+"+points
    );

    createParticles(
        f.x+38,
        f.y+38,
        14
    );

    showCombo();

    /*
      Golden-style frenzy chance
    */
    if(combo>=8 && !frenzy){
        activateFrenzy();
    }

    f.el.remove();

    const index = fruits.indexOf(f);

    if(index>=0){
        fruits.splice(index,1);
    }
}

function showCombo(){

    if(combo<2) return;

    comboEl.textContent =
        "COMBO x"+combo;

    comboEl.classList.remove("comboShow");

    void comboEl.offsetWidth;

    comboEl.classList.add("comboShow");

    clearTimeout(comboTimer);

    comboTimer = setTimeout(()=>{
        combo=0;
    },900);
}

/* =========================
   BOMB
========================= */

function hitBomb(f){

    f.dead=true;

    lives--;

    updateHUD();

    flash.classList.remove("bombHit");

    void flash.offsetWidth;

    flash.classList.add("bombHit");

    createParticles(
        f.x+38,
        f.y+38,
        25
    );

    showPoints(
        f.x+20,
        f.y+20,
        "💥 -1 ❤️"
    );

    combo=0;

    f.el.remove();

    const index=fruits.indexOf(f);

    if(index>=0){
        fruits.splice(index,1);
    }

    if(lives<=0){

        setTimeout(gameOver,300);
    }
}

/* =========================
   FRENZY
========================= */

function activateFrenzy(){

    frenzy=true;

    frenzyEl.classList.remove("frenzyOn");

    void frenzyEl.offsetWidth;

    frenzyEl.classList.add("frenzyOn");

    clearTimeout(frenzyTimer);

    frenzyTimer=setTimeout(()=>{
        frenzy=false;
    },5000);
}

/* =========================
   EFFECTS
========================= */

function showPoints(x,y,text){

    const el=document.createElement("div");

    el.className="point";

    el.textContent=text;

    el.style.left=x+"px";
    el.style.top=y+"px";

    game.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },750);
}

function createParticles(x,y,count){

    for(let i=0;i<count;i++){

        const p=document.createElement("div");

        p.className="particle";

        p.style.left=x+"px";
        p.style.top=y+"px";

        const angle=random(0,Math.PI*2);
        const distance=random(30,100);

        p.style.setProperty(
            "--dx",
            Math.cos(angle)*distance+"px"
        );

        p.style.setProperty(
            "--dy",
            Math.sin(angle)*distance+"px"
        );

        game.appendChild(p);

        setTimeout(()=>{
            p.remove();
        },650);
    }
}

/* =========================
   GAME OVER
========================= */

function gameOver(){

    if(!playing) return;

    playing=false;

    clearInterval(spawnTimer);

    cancelAnimationFrame(gameLoop);

    spawnTimer=null;
    gameLoop=null;

    fruits.forEach(f=>{
        if(f.el) f.el.remove();
    });

    fruits=[];

    finalScore.textContent =
        "SCORE: "+score;

    startBtn.textContent =
        "PLAY AGAIN";

    menu.style.display="flex";
}

/* =========================
   INPUT
========================= */

game.addEventListener(
    "touchstart",
    startSwipe,
    {passive:false}
);

game.addEventListener(
    "touchmove",
    moveSwipe,
    {passive:false}
);

game.addEventListener(
    "touchend",
    endSwipe,
    {passive:false}
);

/* mouse support for PC */
game.addEventListener(
    "mousedown",
    startSwipe
);

game.addEventListener(
    "mousemove",
    moveSwipe
);

game.addEventListener(
    "mouseup",
    endSwipe
);

startBtn.addEventListener(
    "click",
    startGame
);

/* prevent accidental scrolling */
document.addEventListener(
    "touchmove",
    e=>{
        if(playing){
            e.preventDefault();
        }
    },
    {passive:false}
);

updateHUD();
</script>

</body>
</html>

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Ninja Fruit</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MAIN MENU -->
    <div id="menu" class="screen">
        <div class="menu-box">

            <div class="ninja">🥷</div>

            <div class="small-title">THE ULTIMATE</div>

            <h1>
                NINJA
                <span>FRUIT</span>
            </h1>

            <div class="line">⚔</div>

            <p>SLICE • COMBO • SURVIVE</p>

            <!-- IMPORTANT: THIS IS THE START BUTTON -->
            <button id="startBtn" type="button">
                START GAME
                <span>➜</span>
            </button>

            <small>
                Tap to choose your mode
            </small>

        </div>
    </div>


    <!-- MODE SCREEN -->
    <div id="modeScreen" class="screen hidden">

        <div class="mode-box">

            <div class="small-title">
                READY YOUR BLADE
            </div>

            <h2>
                CHOOSE <span>YOUR MODE</span>
            </h2>

            <p>
                Tap a mode to start
            </p>

            <div class="modes">

                <button id="classicBtn"
                        class="mode classic"
                        type="button">

                    <div class="mode-icon">💣</div>

                    <strong>CLASSIC</strong>

                    <small>3 LIVES • BOMBS</small>

                </button>


                <button id="zenBtn"
                        class="mode zen"
                        type="button">

                    <div class="mode-icon">🌿</div>

                    <strong>ZEN</strong>

                    <small>NO BOMBS</small>

                </button>

            </div>

            <button id="backBtn"
                    class="back"
                    type="button">
                ← BACK
            </button>

        </div>

    </div>


    <!-- GAME -->
    <div id="gameScreen" class="hidden">

        <canvas id="canvas"></canvas>

        <div class="hud">

            <div>
                SCORE
                <strong id="score">0</strong>
            </div>

            <div>
                COMBO
                <strong id="combo">0</strong>
            </div>

            <div>
                LIVES
                <strong id="lives">❤️❤️❤️</strong>
            </div>

        </div>

        <button id="musicButton">
            🔊
        </button>

    </div>


    <!-- GAME OVER -->
    <div id="gameOver" class="screen hidden">

        <div class="game-over">

            <div class="ninja">💥</div>

            <div class="small-title">
                NICE TRY, NINJA
            </div>

            <h2>GAME OVER</h2>

            <p>FINAL SCORE</p>

            <strong id="finalScore">0</strong>

            <button id="restartBtn">
                PLAY AGAIN ↻
            </button>

            <button id="menuBtn" class="back">
                MAIN MENU
            </button>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
```
